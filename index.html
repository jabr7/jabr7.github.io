<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
			<title>Ocean Portfolio - Joaquin Bonifacino</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
	<style>
		:root{
			--ui-bg: #050506;
			--ui-panel: rgba(12, 12, 14, 0.70);
			--ui-panel-strong: rgba(12, 12, 14, 0.86);
			--ui-text: rgba(255,255,255,0.92);
			--ui-muted: rgba(255,255,255,0.62);
			--ui-border: rgba(255,255,255,0.14);
			--ui-border-strong: rgba(255,255,255,0.22);
			--ui-radius: 14px;
			--ui-radius-sm: 10px;
			--ui-shadow: 0 30px 80px rgba(0,0,0,0.65);
		}

		body {
			margin: 0;
			overflow: hidden;
			background: var(--ui-bg);
			color: var(--ui-text);
			font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
			letter-spacing: 0.01em;
		}

		body::before{
			content:"";
			position: fixed;
			inset: 0;
			pointer-events: none;
			background:
				repeating-linear-gradient(
					0deg,
					rgba(255,255,255,0.018) 0px,
					rgba(255,255,255,0.018) 1px,
					transparent 1px,
					transparent 3px
				),
				radial-gradient(1200px 800px at 10% 10%, rgba(255,255,255,0.06), transparent 55%),
				radial-gradient(900px 600px at 90% 15%, rgba(255,255,255,0.035), transparent 52%);
			opacity: 0.65;
			mix-blend-mode: overlay;
		}

		canvas { display: block; }

		#hud { position: absolute; top: 10px; left: 10px; color: var(--ui-text); font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; z-index: 100; }

		.hud-button {
			appearance: none;
			border: 1px solid var(--ui-border);
			background: var(--ui-panel);
			color: var(--ui-text);
			border-radius: 999px;
			padding: 7px 12px;
			cursor: pointer;
			font-size: 12px;
			line-height: 1;
			transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
		}
		.hud-button:hover { background: var(--ui-panel-strong); border-color: var(--ui-border-strong); transform: translateY(-1px); }
		.hud-button:active { transform: translateY(0); }

		#profile-card { 
			position: absolute; 
			top: 60px; 
			left: 10px; 
			text-align: left;
			background: var(--ui-panel); 
			padding: 14px 14px 12px; 
			border-radius: var(--ui-radius); 
			border: 1px solid var(--ui-border);
			z-index: 100;
			pointer-events: auto;
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
		}
		#profile-card a { color: var(--ui-text); text-decoration: none; font-weight: 500; font-size: 12px; opacity: 0.82; }
		#profile-card a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }

		.profile-name{
			font-family: "Fraunces", ui-serif, Georgia, serif;
			font-weight: 650;
			font-size: 18px;
			letter-spacing: 0.01em;
			color: var(--ui-text);
			margin-bottom: 2px;
		}
		.profile-role{
			font-size: 11px;
			color: var(--ui-muted);
			letter-spacing: 0.12em;
			text-transform: uppercase;
			margin-bottom: 10px;
		}

		#contact-cta {
			position: fixed;
			bottom: 20px;
			right: 20px;
			background: var(--ui-panel);
			color: var(--ui-text);
			border: 1px solid var(--ui-border);
			padding: 10px 14px;
			border-radius: 999px;
			cursor: pointer;
			font-size: 12px;
			font-weight: 500;
			z-index: 100;
			box-shadow: var(--ui-shadow);
			transition: transform 160ms ease, background 160ms ease, border-color 160ms ease, opacity 160ms ease;
			text-decoration: none;
			display: inline-block;
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
		}
		#contact-cta:hover {
			transform: translateY(-1px);
			background: var(--ui-panel-strong);
			border-color: var(--ui-border-strong);
		}
		#contact-cta:active {
			transform: translateY(0);
		}
		@media (max-width: 768px) {
			#contact-cta {
				bottom: 10px;
				right: 10px;
				padding: 10px 20px;
				font-size: 13px;
			}
		}

		/* Mobile controls styling */
		#mobile-controls {
			font-family: 'Arial', sans-serif;
		}

		#mobile-controls button:active {
			transform: scale(0.9) !important;
		}

		/* Hide mobile controls in portrait mode */
		@media (orientation: portrait) {
			#mobile-controls {
				display: none !important;
			}
		}

		/* Show mobile controls only in landscape mode */
		@media (orientation: landscape) {
			#mobile-controls {
				display: block !important;
			}
		}

		/* Prevent text selection on mobile */
		* {
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			-khtml-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
		}

		/* Allow text selection in modals */
		.swal2-popup * {
			-webkit-user-select: text;
			-khtml-user-select: text;
			-moz-user-select: text;
			-ms-user-select: text;
			user-select: text;
		}



		/* Mobile SweetAlert2 fixes */
		@media (max-width: 768px) {
			.swal2-popup {
				max-height: 90vh !important;
				overflow-y: auto !important;
				margin: 10px !important;
			}

			.swal2-title {
				font-size: 1.5em !important;
				margin-bottom: 15px !important;
			}

			.swal2-actions {
				margin-top: 20px !important;
			}

			.swal2-confirm {
				min-width: 80px !important;
				height: 44px !important;
				font-size: 1.2em !important;
			}

			/* Ensure info button is visible and properly sized on mobile */
			#info-btn {
				font-size: 16px !important;
				padding: 8px 12px !important;
				min-width: 60px !important;
				min-height: 36px !important;
				display: flex !important;
				align-items: center !important;
				justify-content: center !important;
				background: rgba(0,0,0,0.8) !important;
				border: 2px solid #666 !important;
				border-radius: 6px !important;
				position: absolute !important;
				top: 10px !important;
				left: 10px !important;
				z-index: 100 !important;
			}
		}

	</style>
</head>
<body>
			<div id="hud" style="position: relative;">
			<button id="info-btn" class="hud-button" style="position: absolute; top: 10px; left: 10px; z-index: 100;">Controls</button>
		</div>

		<div id="profile-card">
			<div class="profile-name">Joaquin Bonifacino</div>
			<div class="profile-role">Applied AI Engineer</div>
			<div style="display: flex; flex-wrap: wrap; gap: 12px;">
				<a href="https://linkedin.com/in/joaquin-bonifacino" target="_blank">LinkedIn</a>
				<a href="https://github.com/jabrPromtior" target="_blank">GitHub (Work)</a>
				<a href="https://github.com/jabr7" target="_blank">GitHub (Personal)</a>
			</div>
		</div>

		<!-- Contact CTA Button -->
		<a id="contact-cta" href="https://linkedin.com/in/joaquin-bonifacino" target="_blank">Contact</a>

		<!-- Simple LoFi Music Toggle -->
		<button id="music-toggle" class="hud-button" style="position: absolute; top: 20px; left: 150px; z-index: 100;">Music</button>

		<!-- LoFi Background Music -->
		<audio id="lofi-music" loop preload="none">
			<source src="./audio/lofi-chill.mp3" type="audio/mpeg">
			<source src="./audio/lofi-chill.wav" type="audio/wav">
			Your browser does not support the audio element.
		</audio>
	<script type="importmap">
	{
		"imports": {
			"three": "https://unpkg.com/three@0.167.1/build/three.module.js",
			"three/addons/": "https://unpkg.com/three@0.167.1/examples/jsm/"
		}
	}
	</script>

	<!-- Mermaid.js for interactive diagrams -->
	<script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>

	<!-- Simple LoFi Music Script -->
	<script>
		document.addEventListener('DOMContentLoaded', function() {
			const musicToggle = document.getElementById('music-toggle');
			const lofiMusic = document.getElementById('lofi-music');
			let isPlaying = false;

			// Set volume to low for background music
			lofiMusic.volume = 0.2;

			// Toggle music on button click
			musicToggle.addEventListener('click', function() {
				if (isPlaying) {
					lofiMusic.pause();
					musicToggle.textContent = 'Music';
					console.log('LoFi music paused');
				} else {
					lofiMusic.play().then(() => {
						musicToggle.textContent = 'Playing';
						console.log('LoFi music started');
					}).catch(error => {
						console.error('Error playing LoFi music:', error);
						alert('Unable to play music. Please check your browser settings or add audio files.');
					});
				}
				isPlaying = !isPlaying;
			});

			// Update button state when music ends
			lofiMusic.addEventListener('ended', function() {
				isPlaying = false;
				musicToggle.textContent = 'Music';
			});

			console.log('LoFi music ready. Click Music to start.');
		});
	</script>

	<script type="module" src="./main.js"></script>
</body>
</html>
