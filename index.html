	<style>
		:root{
			--ui-bg: #050506;
			--ui-panel: rgba(12, 12, 14, 0.70);
			--ui-panel-strong: rgba(12, 12, 14, 0.86);
			--ui-text: rgba(255,255,255,0.92);
			--ui-muted: rgba(255,255,255,0.62);
			--ui-border: rgba(255,255,255,0.14);
			--ui-border-strong: rgba(255,255,255,0.22);
			--ui-radius: 14px;
			--ui-radius-sm: 10px;
			--ui-shadow: 0 30px 80px rgba(0,0,0,0.65);
		}

		body {
			margin: 0;
			overflow: hidden;
			background: var(--ui-bg);
			color: var(--ui-text);
			font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
			letter-spacing: 0.01em;
		}

		body::before{
			content:"";
			position: fixed;
			inset: 0;
			pointer-events: none;
			background:
				repeating-linear-gradient(
					0deg,
					rgba(255,255,255,0.018) 0px,
					rgba(255,255,255,0.018) 1px,
					transparent 1px,
					transparent 3px
				),
				radial-gradient(1200px 800px at 10% 10%, rgba(255,255,255,0.06), transparent 55%),
				radial-gradient(900px 600px at 90% 15%, rgba(255,255,255,0.035), transparent 52%);
			opacity: 0.65;
			mix-blend-mode: overlay;
		}

		canvas { display: block; }

		#hud { position: absolute; top: 10px; left: 10px; color: var(--ui-text); font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; z-index: 100; }

		.hud-button {
			appearance: none;
			border: 1px solid var(--ui-border);
			background: var(--ui-panel);
			color: var(--ui-text);
			border-radius: 999px;
			padding: 7px 12px;
			cursor: pointer;
			font-size: 12px;
			line-height: 1;
			transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
		}
		.hud-button:hover { background: var(--ui-panel-strong); border-color: var(--ui-border-strong); transform: translateY(-1px); }
		.hud-button:active { transform: translateY(0); }

		#profile-card { 
			position: absolute; 
			top: 60px; 
			left: 10px; 
			text-align: left;
			background: var(--ui-panel); 
			padding: 14px 14px 12px; 
			border-radius: var(--ui-radius); 
			border: 1px solid var(--ui-border);
			z-index: 100;
			pointer-events: auto;
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
		}
		#profile-card a { color: var(--ui-text); text-decoration: none; font-weight: 500; font-size: 12px; opacity: 0.82; }
		#profile-card a:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
		
		.email-copy {
			cursor: pointer;
			color: var(--ui-text);
			text-decoration: none;
			font-weight: 500;
			font-size: 12px;
			opacity: 0.82;
			position: relative;
			display: inline-block;
		}
		.email-copy:hover { 
			opacity: 1; 
			text-decoration: underline;
			text-underline-offset: 3px;
		}
		.email-copy.copied {
			opacity: 1;
			color: rgba(255,255,255,0.95);
		}

		.profile-name{
			font-family: "Fraunces", ui-serif, Georgia, serif;
			font-weight: 650;
			font-size: 18px;
			letter-spacing: 0.01em;
			color: var(--ui-text);
			margin-bottom: 2px;
		}
		.profile-role{
			font-size: 11px;
			color: var(--ui-muted);
			letter-spacing: 0.12em;
			text-transform: uppercase;
			margin-bottom: 10px;
		}


		/* Mobile controls styling */
		#mobile-controls {
			font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
		}

		#mobile-controls button:active {
			transform: scale(0.9) !important;
		}

		/* Hide mobile controls in portrait mode */
		@media (orientation: portrait) {
			#mobile-controls {
				display: none !important;
			}
		}

		/* Show mobile controls only in landscape mode */
		@media (orientation: landscape) {
			#mobile-controls {
				display: block !important;
			}
		}

		/* Prevent text selection on mobile */
		* {
			-webkit-touch-callout: none;
			-webkit-user-select: none;
			-khtml-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
		}

		/* Allow text selection in modals */
		.swal2-popup * {
			-webkit-user-select: text;
			-khtml-user-select: text;
			-moz-user-select: text;
			-ms-user-select: text;
			user-select: text;
		}



		/* Mobile SweetAlert2 fixes */
		@media (max-width: 768px) {
			#profile-card,
			#music-toggle {
				display: none !important;
			}

			.swal2-popup {
				max-height: 90vh !important;
				overflow-y: auto !important;
				margin: 10px !important;
			}

			.swal2-title {
				font-size: 1.5em !important;
				margin-bottom: 15px !important;
			}

			.swal2-actions {
				margin-top: 20px !important;
			}

			.swal2-confirm {
				min-width: 80px !important;
				height: 44px !important;
				font-size: 1.2em !important;
			}

			/* Ensure info button is visible and properly sized on mobile */
			#info-btn {
				font-size: 16px !important;
				padding: 8px 12px !important;
				min-width: 60px !important;
				min-height: 36px !important;
				display: flex !important;
				align-items: center !important;
				justify-content: center !important;
				background: rgba(0,0,0,0.8) !important;
				border: 2px solid #666 !important;
				border-radius: 6px !important;
				position: absolute !important;
				top: 10px !important;
				left: 10px !important;
				z-index: 100 !important;
			}
		}

		/* Minimalist Loader */
		#loader {
			position: fixed;
			inset: 0;
			background: var(--ui-bg);
			z-index: 10000;
			display: flex;
			align-items: center;
			justify-content: center;
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			opacity: 1;
			transition: opacity 800ms ease-out, visibility 800ms ease-out;
			pointer-events: none;
		}

		#loader.hidden {
			opacity: 0;
			visibility: hidden;
		}

		.loader-content {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 24px;
		}

		.loader-wave {
			width: 2px;
			height: 48px;
			background: var(--ui-text);
			opacity: 0.6;
			position: relative;
			animation: wave-pulse 2400ms ease-in-out infinite;
		}

		.loader-wave::before,
		.loader-wave::after {
			content: '';
			position: absolute;
			left: 0;
			width: 2px;
			background: var(--ui-text);
			opacity: 0.6;
		}

		.loader-wave::before {
			height: 36px;
			left: -12px;
			animation: wave-pulse 2400ms ease-in-out infinite;
			animation-delay: -800ms;
		}

		.loader-wave::after {
			height: 40px;
			left: 12px;
			animation: wave-pulse 2400ms ease-in-out infinite;
			animation-delay: -400ms;
		}

		@keyframes wave-pulse {
			0%, 100% {
				transform: scaleY(0.4) translateY(0);
				opacity: 0.3;
			}
			50% {
				transform: scaleY(1) translateY(-4px);
				opacity: 0.8;
			}
		}

		.loader-text {
			font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
			font-size: 11px;
			letter-spacing: 0.12em;
			text-transform: uppercase;
			color: var(--ui-muted);
			opacity: 0;
			animation: fade-in-delayed 1200ms ease-out forwards;
		}

		@keyframes fade-in-delayed {
			0% {
				opacity: 0;
			}
			100% {
				opacity: 1;
			}
		}

		/* Floating Hint Text */
		#hint-text {
			position: fixed;
			top: 20%;
			left: 50%;
			transform: translateX(-50%);
			font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
			font-size: 14px;
			letter-spacing: 0.1em;
			color: var(--ui-text);
			background: var(--ui-panel-strong);
			padding: 14px 24px;
			border-radius: var(--ui-radius);
			border: 1px solid var(--ui-border-strong);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			opacity: 0;
			visibility: hidden;
			transition: opacity 600ms ease-out, visibility 600ms ease-out;
			pointer-events: none;
			z-index: 10001;
			font-weight: 500;
		}

		#hint-text.visible {
			opacity: 1;
			visibility: visible;
		}

		#hint-text.wave-animate {
			animation: wave-float 3000ms ease-in-out infinite;
		}

		@keyframes wave-float {
			0%, 100% {
				transform: translateX(-50%) translateY(0) rotate(0deg);
			}
			25% {
				transform: translateX(-50%) translateY(-4px) rotate(0.5deg);
			}
			50% {
				transform: translateX(-50%) translateY(-2px) rotate(0deg);
			}
			75% {
				transform: translateX(-50%) translateY(-6px) rotate(-0.5deg);
			}
		}

	</style>

	<!-- Simple LoFi Music Script -->
	<script>
		document.addEventListener('DOMContentLoaded', function() {
			const musicToggle = document.getElementById('music-toggle');
			const lofiMusic = document.getElementById('lofi-music');
			let isPlaying = false;

			// Set volume to low for background music
			lofiMusic.volume = 0.2;

			// Toggle music on button click
			musicToggle.addEventListener('click', function() {
				if (isPlaying) {
					lofiMusic.pause();
					musicToggle.textContent = 'Music';
					console.log('LoFi music paused');
				} else {
					lofiMusic.play().then(() => {
						musicToggle.textContent = 'Playing';
						console.log('LoFi music started');
					}).catch(error => {
						console.error('Error playing LoFi music:', error);
						alert('Unable to play music. Please check your browser settings or add audio files.');
					});
				}
				isPlaying = !isPlaying;
			});

			// Update button state when music ends
			lofiMusic.addEventListener('ended', function() {
				isPlaying = false;
				musicToggle.textContent = 'Music';
			});

			console.log('LoFi music ready. Click Music to start.');
		});

		// Email copy-to-clipboard functionality
		document.addEventListener('DOMContentLoaded', function() {
			const emailCopy = document.getElementById('email-copy');
			if (emailCopy) {
				emailCopy.addEventListener('click', async function(e) {
					e.preventDefault();
					const email = this.getAttribute('data-email');
					try {
						await navigator.clipboard.writeText(email);
						const originalText = this.textContent;
						this.textContent = 'Email (Copied!)';
						setTimeout(() => {
							this.textContent = originalText;
						}, 2000);
					} catch (err) {
						// Fallback for older browsers
						const textArea = document.createElement('textarea');
						textArea.value = email;
						textArea.style.position = 'fixed';
						textArea.style.opacity = '0';
						document.body.appendChild(textArea);
						textArea.select();
						try {
							document.execCommand('copy');
							const originalText = this.textContent;
							this.textContent = 'Email (Copied!)';
							setTimeout(() => {
								this.textContent = originalText;
							}, 2000);
						} catch (fallbackErr) {
							alert('Email: ' + email);
						}
						document.body.removeChild(textArea);
					}
				});
			}
		});
	</script>

	<script type="module" src="./main.js?v=3"></script>
	
	<!-- Loader and Hint Text Logic -->
	<script>
		// Loader fade-out logic
		const MIN_LOADER_TIME = 1000; // Minimum 1 second display time
		const loaderStartTime = performance.now();
		let loaderHidden = false;
		let sceneReadyFired = false;

		function hideLoader() {
			if (loaderHidden) return;
			
			const elapsed = performance.now() - loaderStartTime;
			const remainingTime = Math.max(0, MIN_LOADER_TIME - elapsed);
			
			setTimeout(() => {
				if (loaderHidden) return;
				const loader = document.getElementById('loader');
				if (loader) {
					loaderHidden = true;
					loader.classList.add('hidden');
					setTimeout(() => {
						loader.remove();
						window.dispatchEvent(new CustomEvent('loaderHidden'));
					}, 800);
				}
			}, remainingTime);
		}

		// Listen for scene ready event from main.js
		window.addEventListener('sceneReady', () => {
			sceneReadyFired = true;
			hideLoader();
		});

		// Fallback: hide loader after maximum expected load time
		setTimeout(() => {
			if (!sceneReadyFired) {
				hideLoader();
			}
		}, 5000);

		// Hint text logic
		let hintShown = false;
		let hintTimeout = null;
		let interactionDetected = false;

		function showHint() {
			if (hintShown || interactionDetected) return;
			
			// Wait for loader to be gone before showing hint
			const loader = document.getElementById('loader');
			if (loader && !loader.classList.contains('hidden')) {
				// Retry after loader is gone
				setTimeout(showHint, 500);
				return;
			}

			const hint = document.getElementById('hint-text');
			if (hint) {
				console.log('Showing hint text');
				hint.classList.add('visible', 'wave-animate');
				hintShown = true;
				
				// Auto-hide after 12 seconds
				hintTimeout = setTimeout(() => {
					hideHint();
				}, 12000);

				// Only attach interaction listeners AFTER hint is shown
				setupInteractionListeners();
			} else {
				console.error('Hint text element not found');
			}
		}

		function hideHint() {
			const hint = document.getElementById('hint-text');
			if (hint) {
				hint.classList.remove('visible', 'wave-animate');
				if (hintTimeout) {
					clearTimeout(hintTimeout);
					hintTimeout = null;
				}
			}
		}

		function setupInteractionListeners() {
			// Hide hint on user interaction (only attach once)
			const hideOnInteraction = () => {
				if (hintShown) {
					interactionDetected = true;
					hideHint();
				}
			};

			document.addEventListener('keydown', hideOnInteraction, { once: false });
			document.addEventListener('mousedown', hideOnInteraction, { once: false });
			document.addEventListener('touchstart', hideOnInteraction, { once: false });
		}

		// Show hint after 5 seconds (wait for loader to be gone and scene to be ready)
		setTimeout(() => {
			showHint();
		}, 5000);

		// Hide hint when modal opens
		const observer = new MutationObserver((mutations) => {
			if (document.querySelector('.swal2-container')) {
				hideHint();
			}
		});
		observer.observe(document.body, { childList: true, subtree: true });
	</script>
	
	<!-- Force cache refresh -->
	<script>
		// Clear any cached versions
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.getRegistrations().then(function(registrations) {
				for(let registration of registrations) {
					registration.unregister();
				}
			});
		}
	</script>
